<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>N9ja Bay pitch logo</title>
    <defs>
        <clipPath id="pitch-clip">
            <circle cx="228" cy="228" r="148" />
        </clipPath>
    </defs>

    <!-- Circular pitch with the Nigerian green-white-green rhythm. -->
    <circle cx="228" cy="228" r="148" fill="#008751" />
    <rect x="193" y="80" width="70" height="296" fill="#FFFFFF" clip-path="url(#pitch-clip)" />

    <!-- High-contrast field markings that remain readable at launcher-icon size. -->
    <circle cx="228" cy="228" r="132" fill="none" stroke="#FFFFFF" stroke-width="10" />
    <line x1="228" y1="96" x2="228" y2="360" stroke="#008751" stroke-width="8" />
    <path d="M96 178 H145 V278 H96" fill="none" stroke="#FFFFFF" stroke-width="10" />
    <path d="M360 178 H311 V278 H360" fill="none" stroke="#FFFFFF" stroke-width="10" />
    <circle cx="228" cy="228" r="42" fill="#FFFFFF" stroke="#008751" stroke-width="8" />

    <!-- Simplified football at the center spot. -->
    <circle cx="228" cy="228" r="24" fill="#FFFFFF" stroke="#008751" stroke-width="5" />
    <path d="M228 213 L239 221 L235 234 L221 234 L217 221 Z" fill="#008751" />
    <path d="M228 213 L228 204 M239 221 L248 218 M235 234 L241 243 M221 234 L215 243 M217 221 L208 218"
          fill="none" stroke="#008751" stroke-width="4" stroke-linecap="round" />
</svg>
